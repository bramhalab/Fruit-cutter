<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Air Slice Master - Telemetry Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Force explicit absolute bounds, immune to all browser mobile bar UI bugs */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
        }

        /* Mobile specific fixes to stop text selection */
        * {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>

<body>

    <!-- Game Viewport always 100% full screen -->
    <div id="canvas-container">
        <!-- GLOBAL EXIT BUTTON -->
        <a href="https://brandy1335.github.io/Zero-Touch-Hub/" class="exit-btn">
            <span>⬅ Exit Hub</span>
        </a>

        <video id="webcam" playsinline muted style="display:none;"></video>
        <canvas id="output_canvas"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></canvas>

        <!-- Start Screen -->
        <div id="start-overlay"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.75); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px); padding: 20px; text-align: center;">

            <div class="glass-panel p-8 rounded-3xl flex flex-col items-center max-w-sm w-full">
                <h1 class="text-4xl font-extrabold text-emerald-400 mb-2 title-glow tracking-tight uppercase">Air Slice
                    Master</h1>
                <p
                    class="text-emerald-200 text-sm mb-8 font-medium bg-emerald-900/40 px-3 py-1 rounded-full border border-emerald-500/30 shadow-inner">
                    Telemetry & Analytics 📊</p>

                <div class="flex flex-col gap-4 w-full">
                    <button id="btn-full-ai"
                        class="btn-3d emerald text-white font-bold py-4 px-4 rounded-xl text-sm flex items-center justify-center gap-2">
                        <span>🤖 1. AI Camera Tracking</span>
                    </button>
                    <button id="btn-safe-ar"
                        class="btn-3d indigo text-white font-bold py-4 px-4 rounded-xl text-sm flex items-center justify-center gap-2">
                        <span>👆 2. Safe Mode (Touch)</span>
                    </button>
                </div>

                <div id="loading-spinner" class="loader"></div>

                <div id="error-box"
                    class="bg-red-900/50 border border-red-500 p-3 rounded-lg mt-4 hidden max-w-sm text-left">
                    <p id="error-msg" class="text-red-200 text-xs font-semibold"></p>
                    <p id="error-fix" class="text-white text-[10px] mt-2 opacity-80"></p>
                </div>
            </div>
        </div>

        <!-- HUD -->
        <div class="ui-layer" style="position: absolute; z-index: 10; top: 75px; left: 15px; pointer-events: none;">
            <div
                class="bg-slate-900/60 p-3 rounded-xl backdrop-blur-md border border-slate-500/50 shadow-2xl mb-2 flex items-center gap-2">
                <div class="text-xs font-bold text-slate-300 uppercase tracking-wider">Score</div>
                <div id="score" class="text-emerald-400 text-2xl font-black drop-shadow-[0_0_8px_rgba(52,211,153,0.8)]">
                    0</div>
            </div>
            <!-- Hearts -->
            <div id="lives-container"
                class="flex gap-1 bg-slate-900/40 p-2 rounded-full inline-flex border border-slate-600/30 backdrop-blur-sm">
                <span class="heart text-2xl" id="heart-5">❤️</span>
                <span class="heart text-2xl" id="heart-4">❤️</span>
                <span class="heart text-2xl" id="heart-3">❤️</span>
                <span class="heart text-2xl" id="heart-2">❤️</span>
                <span class="heart text-2xl" id="heart-1">❤️</span>
            </div>
            <!-- AI Coach Toast -->
            <div id="ai-coach-toast"
                style="position: absolute; top: 120px; left: 50%; transform: translateX(-50%); z-index: 55; display: none; background: rgba(15,23,42,0.9); border: 2px solid #f59e0b; padding: 10px 20px; border-radius: 12px; text-align: center; pointer-events: none; transition: opacity 0.5s; opacity: 0;">
                <p class="text-[10px] text-orange-400 font-bold mb-1 tracking-wider uppercase">🤖 AI COACH OPINION</p>
                <p id="ai-coach-text" class="text-white text-md font-bold shadow-sm glow-text">Keep going!</p>
            </div>
        </div>

        <!-- Game Over Overlay -->
        <div id="game-over-overlay"
            style="position: absolute; z-index: 60; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; backdrop-filter: blur(10px);">

            <div class="glass-panel p-8 rounded-3xl flex flex-col items-center max-w-sm w-full mx-4">
                <h1 class="text-5xl font-black text-rose-500 mb-2 drop-shadow-[0_0_15px_rgba(244,63,94,0.6)] uppercase tracking-widest"
                    style="animation: floatAnim 2s ease-in-out infinite;">GAME OVER</h1>
                <p
                    class="text-rose-200 font-bold bg-rose-900/50 px-4 py-1 rounded-full border border-rose-500/30 text-sm mb-6 shadow-inner">
                    You missed too many fruits!</p>

                <div
                    class="bg-slate-900/80 border-2 border-slate-700/50 rounded-2xl p-6 w-full mb-6 shadow-[-5px_5px_20px_rgba(0,0,0,0.5)] relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/10 to-transparent"></div>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest relative">Final Score</p>
                    <p id="final-score"
                        class="text-5xl font-black text-emerald-400 drop-shadow-[0_0_10px_rgba(16,185,129,0.5)] relative mt-1">
                        0</p>
                </div>


                <button id="btn-play-again"
                    class="btn-3d fuchsia w-full text-white font-black py-4 px-8 rounded-xl text-lg flex items-center justify-center gap-3 mb-4">
                    <span class="text-xl">🔄</span> PLAY AGAIN
                </button>
                <button id="btn-home-gameover"
                    class="btn-3d rose w-full text-white font-black py-4 px-8 rounded-xl text-lg flex items-center justify-center gap-3">
                    <span class="text-xl">🏠</span> MAIN MENU
                </button>
            </div>
        </div>

        <!-- Settings Button & Modal -->
        <button id="btn-settings" aria-label="Settings"
            class="btn-3d indigo absolute w-12 h-12 flex items-center justify-center text-xl rounded-full text-white shadow-xl"
            style="top: 15px; right: 15px; z-index: 55;">
            ⚙️
        </button>

        <!-- Pause Button (Hidden initially) -->
        <button id="btn-pause" aria-label="Pause"
            class="btn-3d emerald absolute w-12 h-12 flex items-center justify-center text-xl rounded-full text-white shadow-xl"
            style="top: 15px; right: 80px; z-index: 55; display: none;">
            ⏸️
        </button>

        <!-- Pause Menu Overlay -->
        <div id="pause-modal"
            style="position: absolute; z-index: 90; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px);">

            <div class="glass-panel p-8 rounded-3xl flex flex-col items-center max-w-xs w-full relative">
                <button id="btn-close-pause-x"
                    class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl drop-shadow">✖</button>
                <h2
                    class="text-4xl font-black text-blue-400 mb-8 drop-shadow-[0_0_12px_rgba(96,165,250,0.6)] uppercase tracking-widest">
                    PAUSED</h2>
                <div class="flex flex-col gap-5 w-full">
                    <button id="btn-resume"
                        class="btn-3d blue text-white font-bold py-4 px-4 rounded-xl text-lg flex items-center justify-center gap-2">
                        ▶️ Resume
                    </button>
                    <button id="btn-restart-pause"
                        class="btn-3d emerald text-white font-bold py-4 px-4 rounded-xl text-lg flex items-center justify-center gap-2">
                        🔄 Restart Game
                    </button>
                    <button id="btn-home-pause"
                        class="btn-3d rose text-white font-bold py-4 px-4 rounded-xl text-lg flex items-center justify-center gap-2">
                        🏠 Main Menu
                    </button>
                </div>
            </div>
        </div>

        <div id="settings-modal"
            style="position: absolute; z-index: 100; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px);">

            <div class="glass-panel p-6 rounded-3xl border border-slate-600/50 min-w-[320px] shadow-2xl relative">
                <button id="btn-close-settings-x"
                    class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl drop-shadow">✖</button>
                <h2
                    class="text-2xl font-black text-white mb-6 border-b-2 border-emerald-500/50 pb-3 uppercase tracking-wider text-center drop-shadow">
                    Settings</h2>

                <div
                    class="flex justify-between items-center mb-5 bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                    <span class="text-slate-100 font-bold tracking-wide">🎵 Music (BGM)</span>
                    <input type="checkbox" id="toggle-bgm"
                        class="w-6 h-6 accent-emerald-500 cursor-pointer drop-shadow text-emerald-500">
                </div>
                <div
                    class="flex justify-between items-center mb-5 bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                    <span class="text-slate-100 font-bold tracking-wide">🔊 Sound Effects</span>
                    <input type="checkbox" id="toggle-sfx"
                        class="w-6 h-6 accent-emerald-500 cursor-pointer drop-shadow text-emerald-500">
                </div>

                <button id="btn-close-settings"
                    class="btn-3d emerald w-full text-white font-black py-4 px-4 rounded-xl text-md tracking-wider">
                    SAVE & CLOSE
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Game Settings explicitly for global access before other scripts load
        window.GameSettings = JSON.parse(localStorage.getItem('fruitCutterSettings')) || {
            bgm: true,
            sfx: true,
            aiVoice: true
        };
    </script>

    <!-- Bot Panel and Telemetry are decoupled into bot.js/bot.html -->
    <!-- Game Dependencies -->
    <script src="audio.js"></script>
    <script src="bot.js"></script>
    <script src="ai_learning.js"></script>
    <script src="script.js"></script>
</body>

</html>
