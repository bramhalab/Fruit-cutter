<link rel="stylesheet" href="bot.css">

<!-- Float button to bring logs back -->
<button id="btn-restore-log"
    class="bg-slate-700/80 hover:bg-slate-600 text-emerald-400 border border-slate-500 px-4 py-2 rounded-full cursor-pointer transition-colors shadow-lg text-xs font-bold pointer-events-auto">
    📊 Show Stream Logs
</button>

<!-- System Monitor -->
<div id="bot-panel">
    <div class="text-[10px] text-orange-400 font-bold mb-1 tracking-wider flex justify-between items-center">
        <span>🤖 DATA RECORDER</span>
        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse" title="Recording"></span>
    </div>
    <div class="text-[10px] text-slate-300 flex justify-between"><span>FPS:</span> <span id="bot-fps"
            class="text-white">60</span></div>
    <div class="text-[10px] text-slate-300 flex justify-between"><span>Active Fruits:</span> <span id="bot-fruits"
            class="text-yellow-400">0</span></div>
    <div class="text-[10px] text-slate-300 flex justify-between"><span>Cut / Missed:</span> <span
            class="text-emerald-400"><span id="bot-cut">0</span> / <span id="bot-missed"
                class="text-red-400">0</span></span></div>

    <button id="btn-download-json"
        class="mt-3 w-full bg-orange-600 hover:bg-orange-500 text-white text-[10px] font-bold py-1.5 px-2 rounded transition-colors shadow flex justify-center items-center gap-1 cursor-pointer">
        📥 Download JSON Log
    </button>
    <div class="text-[8px] text-slate-400 mt-1 text-center font-mono">Cut via index finger hold</div>
</div>

<!-- JSON Console -->
<div id="log-panel-wrapper" class="flex flex-col pointer-events-none">
    <!-- Title Bar -->
    <div
        class="bg-slate-800/90 px-4 h-[40px] shrink-0 text-[10px] text-slate-400 font-bold border-b border-t border-slate-700 flex justify-between items-center pointer-events-auto shadow-[0_-5px_15px_rgba(0,0,0,0.5)]">
        <span>LIVE EVENT STREAM</span>
        <div class="flex items-center gap-4">
            <span class="text-emerald-400 animate-pulse">● RECORDING</span>
            <button id="btn-hide-log"
                class="bg-red-600/80 hover:bg-red-500 text-white px-3 py-1 rounded cursor-pointer transition-colors shadow-sm">
                ❌ Hide & Play Fullscreen
            </button>
        </div>
    </div>
    <!-- Logs Body -->
    <div id="logs-body-wrapper" class="flex-1 flex overflow-hidden pointer-events-none">
        <div id="event-logs" class="w-full p-2 overflow-y-auto flex flex-col gap-1 pointer-events-none font-mono">
        </div>
    </div>
</div>
